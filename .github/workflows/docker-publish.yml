name: Build and publish Docker image
run-name: Image ${{ inputs.version || github.ref_name }}

# Push a version tag (1.0.0, v1.0.0, 1.0.0-rc1), or run it from the Actions tab
# with a version. amd64 and arm64 build natively on separate runners, then one
# multi-arch manifest is published as ghcr.io/<owner>/<repo>:<version>, plus
# :latest unless it's a pushed pre-release tag or "latest" was unticked.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: Version, such as 1.0.0
        required: true
      latest:
        description: Also tag it latest
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  # Runs first so a bad version fails in seconds, before any build starts.
  tags:
    name: Resolve tags
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.tags.outputs.image }}
      version: ${{ steps.tags.outputs.version }}
      list: ${{ steps.tags.outputs.list }}
    steps:
      - name: Tags
        id: tags
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          LATEST: ${{ github.event_name == 'push' || inputs.latest }}
        run: |
          release="${VERSION#v}"
          if [[ ! "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The version has to look like 1.0.0 or 1.0.0-rc1, not '$VERSION'"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:$release"
          # A pushed tag with a suffix, such as v1.1.0-rc1, is a pre-release: not latest.
          if [[ "$LATEST" == true && ( "$GITHUB_EVENT_NAME" != push || "$release" != *-* ) ]]; then
            tags+=" $image:latest"
          fi
          echo "Will publish: $tags"
          {
            echo "image=$image"
            echo "version=$release"
            echo "list=$tags"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: tags
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ${{ needs.tags.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed untagged (by digest); the merge job attaches the real tags.
      # No build cache, so `apt upgrade` always picks up the latest packages.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.tags.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    needs: [tags, build]
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ needs.tags.outputs.image }}
      VERSION: ${{ needs.tags.outputs.version }}
      TAGS: ${{ needs.tags.outputs.list }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          for tag in $TAGS; do args+=(-t "$tag"); done
          docker buildx imagetools create "${args[@]}" $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
