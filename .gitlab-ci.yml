stages:
  - build
  - manifest

variables:
  IMAGE_TAG_AMD64: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-amd64
  IMAGE_TAG_ARM64: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-arm64
  GIT_SUBMODULE_STRATEGY: recursive

.docker_login: &docker_login
  - echo $CI_REGISTRY_PASSWORD | docker login $CI_REGISTRY --username $CI_REGISTRY_USER --password-stdin

.threads_setup: &threads_setup
  - export THREADS=$(nproc)
  - |
    # Fall back to 4 threads if nproc didn't return a plain integer
    if ! [[ "$THREADS" =~ ^[0-9]+$ ]]; then
      export THREADS=4
    fi

# amd64 runner uses the docker executor, so the job needs its own
# docker:24.0 + dind service to get a docker daemon to talk to.
build_amd64:
  stage: build
  tags:
    - amd64
  only:
    - tags
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - *docker_login
  script:
    - *threads_setup
    - docker build --pull --build-arg THREADS=$THREADS --provenance=false --platform linux/amd64 -t $IMAGE_TAG_AMD64 .
    - docker push $IMAGE_TAG_AMD64

