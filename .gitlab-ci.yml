# TEMPORARY: amd64-only until the arm64 runner (screamdrum.local) is fixed.
# Its system clock is set to year 2121, which fails TLS cert validation
# against the registry ("certificate has expired or is not yet valid").
# Once fixed, delete this job and uncomment build_arm64 + the original
# publish_manifest above.
publish_manifest:
  stage: manifest
  needs: ["build_amd64"]
  tags:
    - amd64
  only:
    - tags
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_CLI_EXPERIMENTAL: "enabled"
  before_script:
    - *docker_login
  script:
    # only:tags guarantees CI_COMMIT_TAG is set whenever this job runs
    - docker manifest create $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG $IMAGE_TAG_AMD64
    - docker manifest annotate $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG $IMAGE_TAG_AMD64 --os linux --arch amd64
    - docker manifest push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    - docker manifest create $CI_REGISTRY_IMAGE:latest $IMAGE_TAG_AMD64
    - docker manifest annotate $CI_REGISTRY_IMAGE:latest $IMAGE_TAG_AMD64 --os linux --arch amd64
    - docker manifest push $CI_REGISTRY_IMAGE:latest
